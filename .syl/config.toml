# Generated by syl init.
[tracker]
issues = "github"
reviews = "github"

[roles.plan]
harness = "codex"
model = "gpt-5.6-luna"
effort = "medium"
# Sandbox mode: full-access, workspace-write, or read-only (default: full-access).
# Claude ignores this field. syl applies this value over ~/.codex/config.toml.
sandbox = "full-access"
# mcp = true inherits user/project MCP configuration; false strips it for Claude.
# Codex ignores this field. Omitted defaults are true for plan and implement, and false for review.
mcp = true

[roles.implement]
harness = "codex"
model = "gpt-5.6-luna"
effort = "high"
# Sandbox mode: full-access, workspace-write, or read-only (default: full-access).
# Claude ignores this field. syl applies this value over ~/.codex/config.toml.
sandbox = "full-access"
# mcp = true inherits user/project MCP configuration; false strips it for Claude.
# Codex ignores this field. Omitted defaults are true for plan and implement, and false for review.
mcp = true

[roles.review]
harness = "codex"
model = "gpt-5.6-luna"
effort = "medium"
# Sandbox mode: full-access, workspace-write, or read-only (default: full-access).
# Claude ignores this field. syl applies this value over ~/.codex/config.toml.
sandbox = "full-access"
# mcp = true inherits user/project MCP configuration; false strips it for Claude.
# Codex ignores this field. Omitted defaults are true for plan and implement, and false for review.
# Hooks that require MCP may cause one blocked-then-retried tool call in lean sessions.
mcp = false

[loop]
max_iterations = 3
max_gate_attempts = 3
nit_budget = 5

[gate]
# Additional project-relative paths or directory prefixes to protect.
protected_paths = []

[notifications]
enabled = true

[publish]
# Language for generated commit messages and pull request text.
# Omit this setting to use commitgen's configured default.
# language = "pt_br"

[worktree]
root = "~/.syl/worktrees"
# A shell command used to provision dependencies in a fresh worktree.
# Example: setup = "npm ci"
setup = ""
# Additional origin paths to copy into a fresh worktree.
# Example: copy = [".env", ".env.local"]
copy = []
